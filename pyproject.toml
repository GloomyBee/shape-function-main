[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shape-function"
version = "0.1.0"
description = "Phase A+B scaffold for structure-preserving meshfree shape function generation."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
shape-function = "shape_function.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
