model:
  backbone: kernel_operator
  hidden_dim: 64
  num_layers: 2
  feature_mode: minimal
train:
  batch_size: 32
  epochs: 10
  learning_rate: 0.001
  prior_type: gaussian
head:
  basis_order: 1
  fallback_mode: hard
loss:
  mode: legacy_teacher_baseline
  lambda_data: 1.0
  lambda_cons: 0.0001
  lambda_neg: 0.00001
eval:
  compute_teacher_metrics: true
